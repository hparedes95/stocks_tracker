name: Visual design QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  design:
    name: Light and dark · responsive UI
    # Playwright 1.58 is pinned below and supports Ubuntu 24.04, not 26.04.
    # Do not let a moving runner image disable the browser checks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
      - name: Install test environment
        run: uv sync --extra dev --locked
      - name: Install CI-only browser
        run: uv run --extra dev --with playwright==1.58.0 --locked playwright install --with-deps chromium
      - name: Check themes, navigation and screen sizes
        run: uv run --extra dev --with playwright==1.58.0 --locked python scripts/verify_design.py
      - name: Visual captures (fictional data only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stocks-tracker-design-qa
          path: reports/design-qa/
          retention-days: 7
