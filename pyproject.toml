[project]
name = "stocks-tracker"
version = "0.1.0"
description = "Dashboard de monitorizacion de mercado y deteccion de oportunidades"
requires-python = ">=3.11,<3.15"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "scipy>=1.14",
    "requests>=2.32",
    "tenacity>=9.0",
    "rich>=13.9",
    # Los extractos de eToro vienen en XLSX; pandas lo lee a traves de esto.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Fuentes de datos reales. Se instalan aparte porque el nucleo de calculo no
# depende de ellas y los tests corren sin red.
data = [
    "yfinance>=0.2.60",
    "requests-cache>=1.2",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "html5lib",
    "fredapi>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Genera casos en vez de escribirlos. Para el simulador de broker importa
    # mas de lo normal: los tests a mano prueban las secuencias que a uno se le
    # ocurren, y los fallos de contabilidad viven en las que no.
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocks_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
