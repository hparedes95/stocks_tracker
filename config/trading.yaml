# Mandato del bot de trading, expresado como configuracion auditable.
#
# Herramienta PERSONAL DE EXPERIMENTACION. El usuario opera su propio dinero
# bajo su exclusiva responsabilidad. Ninguna metrica pasada garantiza
# resultados futuros. Esto no es asesoramiento financiero ni fiscal.
#
# Este fichero es la unica fuente de los limites. `trading/risk.py` los lee de
# aqui y no tiene ningun numero escrito en el codigo: cambiar un limite se hace
# aqui, queda en el historial de git y se ve en un diff.

mode: simulated                 # simulated | paper | live
autonomy: semi                  # semi | auto  (fase 6: siempre semi)
base_currency: USD
capital_cap: 55.0               # tope duro de capital desplegable (~50 EUR)
initial_equity: 55.0            # solo para el simulador: con que dinero arranca

universe:
  source: universe_membership
  allowed: [SP500, NASDAQ100]   # SOLO EE. UU.
  require_fractionable: true
  min_price: 5.0                # evita chicharros
  min_dollar_volume_20d: 20000000
  exclude_asset_classes: [crypto, commodity, fx]

risk:
  # --- dimensionamiento ---
  risk_per_trade_pct: 1.5       # % de la equity arriesgado hasta el stop
  atr_stop_mult: 2.5            # stop = entrada - 2.5 x ATR14
  atr_trailing: true
  min_notional: 1.0
  max_position_pct: 22.0
  target_position_pct: 15.0
  # --- concentracion ---
  max_positions: 7
  min_positions_for_diversification: 4
  max_sector_pct: 35.0
  max_gross_exposure_pct: 90.0
  min_cash_pct: 10.0
  # --- perdidas ---
  max_daily_loss_pct: 3.0       # sobre la equity de apertura del dia -> HALT_NEW
  max_drawdown_pct: 15.0        # sobre el maximo historico -> KILL SWITCH
  drawdown_warn_pct: 10.0
  # --- actividad ---
  max_orders_per_day: 6
  max_orders_per_ticker_per_day: 1
  max_new_positions_per_day: 3
  max_day_trades_5d: 2          # margen sobre el limite PDT de 3
  min_holding_days: 2           # evita day trades por construccion
  # --- prohibiciones absolutas ---
  # No son configurables a true: `risk.py` las comprueba y lanza ConfigError si
  # alguien las cambia. Estan aqui para que el mandato se lea completo en un
  # solo sitio, no para poder relajarlas.
  allow_shorting: false
  allow_leverage: false
  allow_options: false
  allow_extended_hours: false
  # --- eventos y calidad del dato ---
  block_days_before_earnings: 3
  block_days_after_earnings: 1
  block_if_evidence_not_validated: true
  min_data_coverage: 0.5
  max_data_staleness_hours: 30

execution:
  order_type: market
  time_in_force: day
  use_notional_for_buys: true
  no_trade_window_open_min: 20
  no_trade_window_close_min: 15
  max_price_drift_pct: 2.0
  slippage_bps_assumed: 15
  commission_bps: 0
  fill_at: next_open            # el simulador ejecuta a la apertura siguiente

approval:
  intent_ttl_hours: 18
  require_pin: true
  channels: [ui, telegram]

kill_switch:
  on_daily_loss: halt_new
  on_max_drawdown: flatten
  on_reconcile_mismatch: halt_new
  on_repeated_rejects: halt_new
  on_stale_data: halt_new
  rearm: manual_only            # NUNCA automatico
  cooldown_hours: 12

strategies:
  momentum_multifactor_v1:
    enabled: true
    preset: bot_core            # preset de pesos de factors.yaml
    rebalance_weekday: 0        # 0 = lunes; primer dia habil de la semana
    entry_max_rsi14: 75.0
    exit_pctile: 0.60           # histeresis: se entra en el top N, se sale bajo p60
    rebalance_band_pp: 5.0      # banda muerta de desviacion del peso objetivo
    stop_atr_mult: 2.5
    trailing: true

# ===========================================================================
# VENUES
# ===========================================================================
# Dos carteras, nunca un bote comun. Cada venue tiene su tope de capital, sus
# limites y su estado propio: una racha mala en cripto no puede consumir el
# presupuesto de Polymarket ni al reves, y el kill switch de uno no para al
# otro.
#
# Los numeros de acciones NO sirven aqui. Un -3 % diario es una tarde
# cualquiera en bitcoin, y en un mercado de prediccion el precio ES una
# probabilidad: no tiene ATR ni media de 200 sesiones.
venues:

  kraken:
    enabled: false            # se enciende cuando haya credenciales y validacion
    label: "Kraken (cripto)"
    asset_class: crypto
    quote_currency: EUR
    capital_cap: 25.0
    initial_equity: 25.0
    # Lista blanca corta a proposito. Con 25 EUR y un minimo de orden de unos
    # 5 EUR no caben mas de cuatro posiciones, y anadir monedas pequenas solo
    # anade riesgo de liquidez sin diversificar nada.
    universe:
      allowed: [BTC/EUR, ETH/EUR, SOL/EUR, ADA/EUR, DOT/EUR, LINK/EUR]
      min_daily_volume_eur: 1000000
    risk:
      risk_per_trade_pct: 2.0        # menos operaciones, cada una pesa mas
      atr_stop_mult: 4.0             # stop al ~15-20 %, fuera del ruido normal
      atr_stop_mult_hard: 5.5        # red nativa en el exchange
      atr_trailing: true
      min_notional: 5.0              # minimo tipico de Kraken
      max_position_pct: 40.0         # BTC/ETH: con 4 posiciones no cabe menos
      max_position_pct_non_core: 18.0
      target_position_pct: 25.0
      max_positions: 4
      max_sector_pct: 100.0          # no hay sectores en cripto
      max_gross_exposure_pct: 80.0
      min_cash_pct: 20.0             # reserva mayor: absorbe golpes y compra caidas
      max_daily_loss_pct: 8.0        # un -3 % diario en BTC no es noticia
      max_drawdown_pct: 20.0         # ver docs/03 §5.3: 15 % liquidaria en retrocesos normales
      drawdown_warn_pct: 12.0
      max_orders_per_day: 2
      max_orders_per_ticker_per_day: 1
      max_new_positions_per_day: 2
      max_day_trades_5d: 99          # la regla PDT es de bolsa de EE. UU., aqui no aplica
      min_holding_days: 21
      block_days_before_earnings: 0  # no hay resultados trimestrales
      block_days_after_earnings: 0
      block_if_evidence_not_validated: true
      min_data_coverage: 0.5
      max_data_staleness_hours: 6    # mercado 24/7: 30 h seria una eternidad
      allow_shorting: false
      allow_leverage: false
      allow_options: false
      allow_extended_hours: true     # 24/7: no existe "fuera de horario"
      allow_margin: false            # Kraken lo ofrece en spot; hay que apagarlo
    # Estrategia del venue. Los numeros de aqui NO estan optimizados sobre los
    # datos: son los de manual, elegidos antes de mirar ningun resultado. Esa
    # es la defensa principal contra el sobreajuste, porque con seis monedas y
    # un historico corto cualquier busqueda de parametros encuentra oro que no
    # existe. Si algun dia se toca uno para que el backtest mejore, lo que
    # mejora es el backtest.
    strategies:
      crypto_momentum_v1:
        enabled: true
        regime_ticker: BTC/EUR       # bitcoin marca el regimen de todo
        momentum_fields: [roc_3m, roc_6m]
        exit_rank_buffer: 1          # histeresis: se entra en el top N, se sale bajo N+1
    execution:
      order_type: market
      time_in_force: gtc
      slippage_bps_assumed: 25       # libros mas finos que en acciones
      commission_bps: 26             # taker de Kraken en el tramo mas bajo
      fill_at: next_open

  polymarket:
    enabled: false
    label: "Polymarket (mercados de prediccion)"
    asset_class: prediction
    quote_currency: USDC
    capital_cap: 25.0
    initial_equity: 25.0
    universe:
      min_liquidity_usdc: 5000       # sin libro no hay salida
      min_days_to_resolution: 2      # evita el ruido de las ultimas horas
      max_days_to_resolution: 180
    risk:
      # Aqui NO hay stop: una posicion binaria vale entre 0 y 1 y puede irse a
      # cero de golpe cuando el evento se resuelve. La perdida maxima es lo
      # apostado, y por eso el tamano es el unico control real.
      max_position_pct: 10.0         # nada de concentrar en un solo evento
      max_correlated_pct: 25.0       # eventos del mismo tema (una eleccion, un torneo)
      max_positions: 8
      min_notional: 1.0
      min_cash_pct: 20.0
      max_gross_exposure_pct: 80.0
      max_daily_loss_pct: 10.0
      max_drawdown_pct: 25.0
      drawdown_warn_pct: 15.0
      max_orders_per_day: 4
      max_orders_per_ticker_per_day: 1
      max_new_positions_per_day: 3
      min_holding_days: 0            # se puede salir en cualquier momento si hay libro
      block_if_evidence_not_validated: true
      max_data_staleness_hours: 6
      allow_shorting: false          # comprar NO ya es la posicion contraria
      allow_leverage: false
      allow_options: false
      allow_extended_hours: true
    execution:
      order_type: limit               # a mercado en un libro fino se paga caro
      time_in_force: gtc
      slippage_bps_assumed: 100       # los libros son mucho mas finos
      commission_bps: 0               # Polymarket no cobra comision de trading
      max_spread_pct: 5.0             # si la horquilla es mayor, no se opera

# Politica de autonomia por modo, no global.
#
# `live: auto` es una decision explicita del usuario: el bot abre y cierra
# posiciones sin preguntar nada. Conviene tener claro que quita y que no.
#
# QUITA: el paso en el que una persona lee la propuesta y pulsa aprobar.
#
# NO QUITA: los topes de capital y de posicion, el maximo de ordenes al dia, la
# permanencia minima, el stop por ATR, el halt por perdida diaria ni el kill
# switch por drawdown —que sigue sin rearmarse solo NUNCA—. La estrategia sigue
# sin poder mandar nada al broker sin que la capa de riesgo lo acune.
#
# LO QUE SE PIERDE: el ultimo filtro contra un fallo del propio programa. Con
# aprobacion humana, un calculo mal o un dato corrupto se ven antes de
# ejecutarse; en automatico se ejecutan y se descubren en el registro. Por eso
# el kill switch y los limites de este fichero importan mas, no menos.
autonomy_policy:
  simulated: auto
  paper: auto
  live: auto
