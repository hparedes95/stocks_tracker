# Configuracion general del sistema.
paths:
  warehouse: data/warehouse.duckdb
  http_cache: data/http_cache.sqlite
  raw: data/raw
  logs: data/logs

timezone: Europe/Madrid

providers:
  # Cadena de respaldo. El relevo ocurre POR TICKER y despues de intentarlo:
  # lo que yfinance no consigue traer se le pide a Stooq. Ver providers/chain.py.
  #
  # Stooq no ajusta el cierre por dividendos, asi que una serie servida a
  # medias por cada fuente tendria un salto artificial. `make repair` detecta
  # esas series y las reconstruye enteras desde una sola fuente.
  price: [yfinance, stooq]
  fundamentals: [yfinance]

ingest:
  # Ver docs/00 seccion 1: la estrategia anti rate-limit de Yahoo.
  batch_size: 45           # tickers por peticion a yf.download
  threads: false           # la concurrencia es lo que dispara el bloqueo
  sleep_between_batches: [1.5, 3.5]   # jitter en segundos
  max_requests_per_run: 400
  backfill_years: 10
  # Los metadatos (nombre, bolsa, sector) cambian de año en año, no de día en
  # día, y cuestan una peticion por ticker: con 617 son entre cinco y quince
  # minutos por ejecucion. Se reconsultan solo pasado este plazo, o antes si
  # falta la bolsa o el sector.
  metadata_ttl_days: 30
  fundamentals_ttl_days: 7
  fundamentals_shard_count: 7         # 1/7 del universo por noche

backtest:
  # Frontera entre la muestra con la que se DESCUBRE y la que se reserva para
  # CONFIRMAR. Ver src/stocks_tracker/backtest/experiments.py.
  #
  # Tiene que ser una fecha FIJA y escrita a mano, no una fraccion del historico:
  # con una fraccion, la frontera se desplazaria sola segun entran datos y el
  # tramo que ayer estaba reservado formaria parte del descubrimiento manana.
  # Ese es justo el error que este mecanismo existe para impedir, y ademas seria
  # invisible.
  #
  # Cambiar esta fecha invalida las confirmaciones anteriores. Si la cambias,
  # descongela y vuelve a empezar: no es una preferencia, es parte de la
  # definicion del experimento.
  confirmation_from: "2023-01-01"

compute:
  # Ventana de historico que se recalcula en cada pasada. Recalcular todo el
  # historico cada noche es innecesario; 400 sesiones cubren la MM200 con margen.
  lookback_sessions: 400
  weights_preset: balanced

# Contraste del mismo precio entre proveedores. No verifica el universo entero:
# 600 valores x 3 fuentes al dia son 1.800 peticiones contra APIs gratuitas, y
# eso no acaba en datos verificados sino en un bloqueo por abuso. Se cruza donde
# el error cuesta dinero (cartera y senales) mas una muestra rotatoria.
consensus:
  # Proveedores de CONTRASTE. El almacen ya aporta lo que sirvio Yahoo, asi que
  # aqui van los demas.
  #
  # Cuando haya clave, anadir `twelve_data`: con TRES fuentes, dos que
  # concuerden hacen mayoria y la discrepante queda nombrada, en vez de quedarse
  # todo en "no se sabe cual falla".
  #   1. Cuenta gratuita en twelvedata.com (800 peticiones/dia)
  #   2. La clave va en el .env, NUNCA aqui: este fichero esta en el repositorio
  #      y el repositorio es publico.
  #        TWELVE_DATA_API_KEY=tu-clave
  providers: [stooq]

  # ATENCION: estos dos umbrales NO estan calibrados contra datos reales. Son un
  # punto de partida razonado. La auditoria guarda la dispersion observada de
  # cada comparacion justamente para poder ajustarlos con datos propios; hasta
  # entonces, un porcentaje alto de veredictos 'invalido' probablemente diga mas
  # de los umbrales que de los proveedores.
  tolerancia: 0.005      # 0,5 %: por debajo, dos fuentes "dicen lo mismo"
  maxima: 0.02           # 2 %: por encima, son datos incompatibles

ui:
  locale: es
  tradingview:
    enabled: true          # false fuerza graficos propios en toda la app
    timezone: Europe/Madrid
    default_interval: "D"
  data_freshness_warn_hours: 30
