# ISIN -> ticker.
#
# Trade Republic identifica los valores por ISIN, no por simbolo. Un extracto
# suyo trae "US0378331005" donde nosotros esperamos "AAPL", asi que hace falta
# esta traduccion.
#
# El importador rellena solo lo que reconoce y te dice que ISIN se han quedado
# sin resolver. Anadelos aqui y vuelve a importar; se quedan para siempre.
#
# Truco para encontrar el ticker de un ISIN: buscalo en Yahoo Finance. Ojo con
# los valores cotizados en varias bolsas, porque el ISIN es unico pero el
# ticker no: SAP tiene ISIN aleman y cotiza como SAP.DE en Xetra y como SAP en
# Nueva York. Elige el mercado en el que lo compraste, que es donde esta el
# precio que pagaste.

